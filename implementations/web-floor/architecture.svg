<svg xmlns="http://www.w3.org/2000/svg" width="830" height="410" viewBox="0 0 830 410">
  <defs>
    <marker id="arr"   markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a7a28"/></marker>
    <marker id="arr-o" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bc6818"/></marker>
  </defs>

  <!-- canvas background -->
  <rect width="830" height="410" fill="white"/>

  <!-- ── User ─────────────────────────────────────────────── -->
  <rect x="12" y="158" width="82" height="50" rx="6"
        fill="#f4f4f4" stroke="#777" stroke-width="1.5"/>
  <text x="53" y="179" font-family="Arial,sans-serif" font-size="13"
        fill="#222" text-anchor="middle" font-weight="bold">User</text>
  <text x="53" y="197" font-family="Arial,sans-serif" font-size="11"
        fill="#555" text-anchor="middle">Browser</text>

  <!-- ── web-floor Client group ────────────────────────────── -->
  <rect x="132" y="80"  width="170" height="206" rx="8"
        fill="#eef2ff" stroke="#4466bb" stroke-width="1.5"/>
  <text x="217" y="98" font-family="Arial,sans-serif" font-size="11"
        fill="#2244aa" text-anchor="middle" font-weight="bold">web-floor Client</text>

  <rect x="146" y="110" width="142" height="34" rx="5"
        fill="#c8d4f8" stroke="#4466bb" stroke-width="1.5"/>
  <text x="217" y="131" font-family="Arial,sans-serif" font-size="12"
        fill="#112288" text-anchor="middle">index.html</text>

  <rect x="146" y="152" width="142" height="34" rx="5"
        fill="#c8d4f8" stroke="#4466bb" stroke-width="1.5"/>
  <text x="217" y="173" font-family="Arial,sans-serif" font-size="11"
        fill="#112288" text-anchor="middle">cafeteria-ops.html</text>

  <rect x="146" y="200" width="142" height="34" rx="5"
        fill="#c8d4f8" stroke="#4466bb" stroke-width="1.5"/>
  <text x="217" y="221" font-family="Arial,sans-serif" font-size="12"
        fill="#112288" text-anchor="middle">app.js</text>

  <text x="217" y="256" font-family="Arial,sans-serif" font-size="9"
        fill="#4a5aa0" text-anchor="middle" font-style="italic">one envelope per user action;</text>
  <text x="217" y="267" font-family="Arial,sans-serif" font-size="9"
        fill="#4a5aa0" text-anchor="middle" font-style="italic">renders NDJSON stream incrementally</text>

  <!-- ── Local Runtime group ───────────────────────────────── -->
  <rect x="354" y="42"  width="230" height="150" rx="8"
        fill="#f0fff0" stroke="#3a7835" stroke-width="1.5"/>
  <text x="469" y="60"  font-family="Arial,sans-serif" font-size="11"
        fill="#1f6620" text-anchor="middle" font-weight="bold">Local Runtime</text>

  <rect x="366" y="74"  width="206" height="36" rx="5"
        fill="#b8e4b8" stroke="#3a7835" stroke-width="1.5"/>
  <text x="469" y="97" font-family="Arial,sans-serif" font-size="12"
        fill="#113311" text-anchor="middle">api/flask_gateway.py</text>

  <rect x="366" y="118" width="206" height="30" rx="5"
        fill="#cdeecd" stroke="#3a7835" stroke-width="1"/>
  <text x="469" y="137" font-family="Arial,sans-serif" font-size="10"
        fill="#245224" text-anchor="middle">floor_router.py &#183; floor_state.py</text>

  <rect x="366" y="152" width="206" height="30" rx="5"
        fill="#d4f0d4" stroke="#3a7835" stroke-width="1" opacity="0.85"/>
  <text x="469" y="171" font-family="Arial,sans-serif" font-size="10"
        fill="#336633" text-anchor="middle" font-style="italic">serves public/ static files</text>

  <!-- ── Vercel Deployment group ───────────────────────────── -->
  <rect x="354" y="224" width="230" height="150" rx="8"
        fill="#fff8f0" stroke="#bc6818" stroke-width="1.5"/>
  <text x="469" y="242" font-family="Arial,sans-serif" font-size="11"
        fill="#804010" text-anchor="middle" font-weight="bold">Vercel Deployment</text>

  <rect x="366" y="254" width="206" height="30" rx="5"
        fill="#f8d8a8" stroke="#bc6818" stroke-width="1" opacity="0.85"/>
  <text x="469" y="273" font-family="Arial,sans-serif" font-size="10"
        fill="#563010" text-anchor="middle" font-style="italic">@vercel/static (public/**)</text>

  <rect x="366" y="292" width="206" height="46" rx="5"
        fill="#f8d8a8" stroke="#bc6818" stroke-width="1.5"/>
  <text x="469" y="313" font-family="Arial,sans-serif" font-size="12"
        fill="#552200" text-anchor="middle">@vercel/python</text>
  <text x="469" y="330" font-family="Arial,sans-serif" font-size="10"
        fill="#775522" text-anchor="middle">api/index.py &#x2192; flask_gateway.app</text>

  <!-- ── OpenFloor Agents group ────────────────────────────── -->
  <rect x="626" y="132" width="192" height="150" rx="8"
        fill="#fef0fd" stroke="#884488" stroke-width="1.5"/>
  <text x="722" y="152" font-family="Arial,sans-serif" font-size="12"
        fill="#551155" text-anchor="middle" font-weight="bold">OpenFloor Agents</text>
  <line x1="640" y1="162" x2="804" y2="162"
        stroke="#884488" stroke-width="0.8" opacity="0.5"/>
  <text x="722" y="180" font-family="Arial,sans-serif" font-size="11"
        fill="#663366" text-anchor="middle">convener + specialists</text>
  <text x="722" y="200" font-family="Arial,sans-serif" font-size="11"
        fill="#663366" text-anchor="middle">local agents</text>
  <text x="722" y="220" font-family="Arial,sans-serif" font-size="11"
        fill="#663366" text-anchor="middle">remote agents (HTTPS)</text>
  <text x="722" y="252" font-family="Arial,sans-serif" font-size="9"
        fill="#7a5a7a" text-anchor="middle" font-style="italic">floorHolder status +</text>
  <text x="722" y="263" font-family="Arial,sans-serif" font-size="9"
        fill="#7a5a7a" text-anchor="middle" font-style="italic">resumeAfterFloorHolder</text>

  <!-- ── EDGES ─────────────────────────────────────────────── -->

  <!-- User → Client group -->
  <line x1="94" y1="183" x2="130" y2="183"
        stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- app.js → flask_gateway.py  (local, green arc) -->
  <path d="M 288 210 Q 322 130 364 100"
        fill="none" stroke="#2a7a28" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="324" y="140" font-family="Arial,sans-serif" font-size="9"
        fill="#1f6620" text-anchor="middle">POST /api/floor/*</text>
  <text x="324" y="151" font-family="Arial,sans-serif" font-size="9"
        fill="#1f6620" text-anchor="middle">or /api/proxy-*</text>

  <!-- flask_gateway → Agents (forward, solid green) -->
  <line x1="572" y1="96" x2="626" y2="165"
        stroke="#2a7a28" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Agents → flask_gateway (return, dashed green) -->
  <line x1="626" y1="157" x2="572" y2="88"
        stroke="#2a7a28" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>

  <!-- app.js → @vercel/python  (Vercel, orange arc) -->
  <path d="M 288 224 Q 322 300 364 316"
        fill="none" stroke="#bc6818" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="318" y="288" font-family="Arial,sans-serif" font-size="9"
        fill="#804010" text-anchor="middle">POST /api/floor/*</text>
  <text x="318" y="299" font-family="Arial,sans-serif" font-size="9"
        fill="#804010" text-anchor="middle">or /api/proxy-*</text>

  <!-- @vercel/python → Agents (forward, solid orange) -->
  <line x1="572" y1="316" x2="626" y2="225"
        stroke="#bc6818" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <!-- Agents → @vercel/python (return, dashed orange) -->
  <line x1="626" y1="231" x2="572" y2="322"
        stroke="#bc6818" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>

  <!-- ── Legend ────────────────────────────────────────────── -->
  <line x1="220" y1="398" x2="244" y2="398" stroke="#2a7a28" stroke-width="2"/>
  <text x="248" y="402" font-family="Arial,sans-serif" font-size="10" fill="#2a7a28">Local deployment</text>
  <line x1="360" y1="398" x2="384" y2="398" stroke="#bc6818" stroke-width="2"/>
  <text x="388" y="402" font-family="Arial,sans-serif" font-size="10" fill="#bc6818">Vercel deployment</text>
  <line x1="510" y1="397" x2="534" y2="397" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="538" y="402" font-family="Arial,sans-serif" font-size="10" fill="#555">response (return)</text>
</svg>
