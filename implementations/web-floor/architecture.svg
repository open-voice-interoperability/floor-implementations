<svg xmlns="http://www.w3.org/2000/svg" width="830" height="400" viewBox="0 0 830 400">
  <defs>
    <marker id="arr"   markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a7a28"/></marker>
    <marker id="arr-o" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bc6818"/></marker>
  </defs>

  <!-- canvas background -->
  <rect width="830" height="400" fill="white"/>

  <!-- ── User ─────────────────────────────────────────────── -->
  <rect x="12" y="158" width="82" height="50" rx="6"
        fill="#f4f4f4" stroke="#777" stroke-width="1.5"/>
  <text x="53" y="179" font-family="Arial,sans-serif" font-size="13"
        fill="#222" text-anchor="middle" font-weight="bold">User</text>
  <text x="53" y="197" font-family="Arial,sans-serif" font-size="11"
        fill="#555" text-anchor="middle">Browser</text>

  <!-- ── web-floor Client group ────────────────────────────── -->
  <rect x="132" y="88"  width="162" height="190" rx="8"
        fill="#eef2ff" stroke="#4466bb" stroke-width="1.5"/>
  <text x="213" y="106" font-family="Arial,sans-serif" font-size="11"
        fill="#2244aa" text-anchor="middle" font-weight="bold">web-floor Client</text>

  <rect x="148" y="118" width="130" height="36" rx="5"
        fill="#c8d4f8" stroke="#4466bb" stroke-width="1.5"/>
  <text x="213" y="141" font-family="Arial,sans-serif" font-size="12"
        fill="#112288" text-anchor="middle">index.html</text>

  <rect x="148" y="170" width="130" height="36" rx="5"
        fill="#c8d4f8" stroke="#4466bb" stroke-width="1.5"/>
  <text x="213" y="193" font-family="Arial,sans-serif" font-size="12"
        fill="#112288" text-anchor="middle">app.js</text>

  <!-- ── Local Runtime group ───────────────────────────────── -->
  <rect x="346" y="46"  width="212" height="135" rx="8"
        fill="#f0fff0" stroke="#3a7835" stroke-width="1.5"/>
  <text x="452" y="64"  font-family="Arial,sans-serif" font-size="11"
        fill="#1f6620" text-anchor="middle" font-weight="bold">Local Runtime</text>

  <rect x="358" y="78"  width="188" height="36" rx="5"
        fill="#b8e4b8" stroke="#3a7835" stroke-width="1.5"/>
  <text x="452" y="101" font-family="Arial,sans-serif" font-size="12"
        fill="#113311" text-anchor="middle">api/flask_gateway.py</text>

  <rect x="358" y="122" width="188" height="30" rx="5"
        fill="#d4f0d4" stroke="#3a7835" stroke-width="1" opacity="0.85"/>
  <text x="452" y="141" font-family="Arial,sans-serif" font-size="10"
        fill="#336633" text-anchor="middle" font-style="italic">serves public/ static files</text>

  <!-- ── Vercel Deployment group ───────────────────────────── -->
  <rect x="346" y="213" width="212" height="163" rx="8"
        fill="#fff8f0" stroke="#bc6818" stroke-width="1.5"/>
  <text x="452" y="231" font-family="Arial,sans-serif" font-size="11"
        fill="#804010" text-anchor="middle" font-weight="bold">Vercel Deployment</text>

  <rect x="358" y="244" width="188" height="34" rx="5"
        fill="#f8d8a8" stroke="#bc6818" stroke-width="1" opacity="0.85"/>
  <text x="452" y="266" font-family="Arial,sans-serif" font-size="10"
        fill="#563010" text-anchor="middle" font-style="italic">@vercel/static (public/**)</text>

  <rect x="358" y="290" width="188" height="46" rx="5"
        fill="#f8d8a8" stroke="#bc6818" stroke-width="1.5"/>
  <text x="452" y="311" font-family="Arial,sans-serif" font-size="12"
        fill="#552200" text-anchor="middle">@vercel/python</text>
  <text x="452" y="328" font-family="Arial,sans-serif" font-size="10"
        fill="#775522" text-anchor="middle">api/index.py &#x2192; flask_gateway.app</text>

  <!-- ── OpenFloor Agents group ────────────────────────────── -->
  <rect x="612" y="140" width="200" height="112" rx="8"
        fill="#fef0fd" stroke="#884488" stroke-width="1.5"/>
  <text x="712" y="160" font-family="Arial,sans-serif" font-size="12"
        fill="#551155" text-anchor="middle" font-weight="bold">OpenFloor Agents</text>
  <line x1="626" y1="170" x2="798" y2="170"
        stroke="#884488" stroke-width="0.8" opacity="0.5"/>
  <text x="712" y="189" font-family="Arial,sans-serif" font-size="11"
        fill="#663366" text-anchor="middle">local agents</text>
  <text x="712" y="212" font-family="Arial,sans-serif" font-size="11"
        fill="#663366" text-anchor="middle">remote agents (HTTPS)</text>

  <!-- ── EDGES ─────────────────────────────────────────────── -->

  <!-- User → Client group -->
  <line x1="94" y1="183" x2="130" y2="183"
        stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- app.js → flask_gateway.py  (local, green arc) -->
  <path d="M 278 182 Q 308 116 356 97"
        fill="none" stroke="#2a7a28" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="306" y="124" font-family="Arial,sans-serif" font-size="9"
        fill="#1f6620" text-anchor="middle">POST /api/</text>
  <text x="306" y="135" font-family="Arial,sans-serif" font-size="9"
        fill="#1f6620" text-anchor="middle">proxy-send</text>

  <!-- flask_gateway → Agents (forward, solid green) -->
  <line x1="546" y1="98" x2="612" y2="173"
        stroke="#2a7a28" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Agents → flask_gateway (return, dashed green) -->
  <line x1="612" y1="165" x2="546" y2="91"
        stroke="#2a7a28" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>

  <!-- app.js → @vercel/python  (Vercel, orange arc) -->
  <path d="M 278 192 Q 308 268 356 312"
        fill="none" stroke="#bc6818" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="302" y="261" font-family="Arial,sans-serif" font-size="9"
        fill="#804010" text-anchor="middle">POST /api/</text>
  <text x="302" y="272" font-family="Arial,sans-serif" font-size="9"
        fill="#804010" text-anchor="middle">proxy-send</text>

  <!-- @vercel/python → Agents (forward, solid orange) -->
  <line x1="546" y1="314" x2="612" y2="213"
        stroke="#bc6818" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <!-- Agents → @vercel/python (return, dashed orange) -->
  <line x1="612" y1="219" x2="546" y2="320"
        stroke="#bc6818" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>

  <!-- ── Legend ────────────────────────────────────────────── -->
  <line x1="220" y1="388" x2="244" y2="388" stroke="#2a7a28" stroke-width="2"/>
  <text x="248" y="392" font-family="Arial,sans-serif" font-size="10" fill="#2a7a28">Local deployment</text>
  <line x1="360" y1="388" x2="384" y2="388" stroke="#bc6818" stroke-width="2"/>
  <text x="388" y="392" font-family="Arial,sans-serif" font-size="10" fill="#bc6818">Vercel deployment</text>
  <line x1="510" y1="387" x2="534" y2="387" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="538" y="392" font-family="Arial,sans-serif" font-size="10" fill="#555">response (return)</text>
</svg>
